experimental = []

[cargo]
global_args = []

[cargo.command_args]

[package]
name = "qqmusic_api_helper_next"

[targets.apple]
enabled = true
output = "dist/apple"
deployment_target = "16.0"
include_macos = false

[targets.apple.swift]
module_name = "QqmusicApiHelperNext"
tools_version = "5.9"
error_style = "throwing"

[targets.apple.swift.type_mappings]

[targets.apple.xcframework]

[targets.apple.spm]
distribution = "local"
layout = "ffi-only"
skip_package_swift = false

[targets.apple.debug_symbols]
enabled = false
format = "zip"
bundle = "unstripped"
standalone_archive = true

[targets.android]
enabled = true
output = "dist/android"
min_sdk = 24

[targets.android.kotlin]
package = "com.example.qqmusic_api_helper_next"
desktop_loader = "bundled"
api_style = "top_level"
error_style = "throwing"
factory_style = "constructors"

[targets.android.kotlin.desktop_pack]
enabled = false

[targets.android.kotlin.type_mappings]

[targets.android.header]

[targets.android.pack]

[targets.android.link]
extra_args = ["-Wl,-z,max-page-size=16384"]

[targets.android.debug_symbols]
enabled = false
format = "zip"
bundle = "unstripped"
standalone_archive = true

[targets.kotlin_multiplatform]
output = "dist/kotlin-multiplatform"
enabled = false
preview_prune_unsupported = false

[targets.wasm]
# 未适配、未验证：保持关闭，避免被误读为受支持的平台（docs/RELEASING.md §2.2/§13.2）。
# 启动 wasm 适配时再打开，并先补工具链与验证记录。
enabled = false
triple = "wasm32-unknown-unknown"
profile = "release"
output = "dist/wasm"

[targets.wasm.optimize]

[targets.wasm.typescript.type_mappings]

[targets.wasm.npm]

[targets.java.jvm]
enabled = false
output = "dist/java"
strip_symbols = false

[targets.java.jvm.debug_symbols]
enabled = false
format = "zip"
bundle = "unstripped"
standalone_archive = true

[targets.java.android]
enabled = false
output = "dist/java/android"
min_sdk = 24

[targets.dart]
output = "dist/dart"
enabled = false

[targets.python]
output = "dist/python"
enabled = false

[targets.python.wheel]

[targets.csharp]
output = "dist/csharp"
enabled = false

[targets.csharp.nuget]

[targets.c]
output = "dist/c"
enabled = false

[package]
name = "qqmusic-api-helper-next"
description = "Cross-platform Rust component for the QQ Music API family (based on QQMusicApi)"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/LeeDespo/QQMusicApi_HelperNext"

[lib]
name = "qqmusic_api_helper_next"
crate-type = ["cdylib", "staticlib", "rlib"]

# One binary, one product: the line-based JSON adapter an app drives as a child
# process (this is what the macOS player uses; `--version` prints the component
# and protocol version). The `[lib]` targets beside it are the FFI surface.
[[bin]]
name = "qqmusic-helper-next"
path = "src/bin/stdio.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PlaylistBaseWrite sometimes returns GBK bytes despite claiming UTF-8.
encoding_rs = "0.8"
# QRC word-level lyrics arrive zlib-compressed; this is the pure-Rust inflate
# (no C), which keeps the "one static binary, no toolchain" property intact.
miniz_oxide = "0.9"
# `getppid`, for exiting when the host that spawned this component goes away.
libc = "0.2"
# Blocking HTTP with rustls. The component answers one call at a time per host
# thread, so an async runtime would buy nothing and would multiply the
# dependency surface of something meant to be embedded in a phone app.
ureq = { version = "3", features = ["json"] }
# Bindings generator: `#[data]` on the models, `#[export]` on the API, then
# `boltffi pack` emits Swift/Kotlin/Java/C#/TypeScript/Python bindings.
boltffi = "0.31"
# The device identity the upstream gates some interfaces on: its service wants an
# RSA-wrapped AES key, so the component carries the crypto it takes to ask.
aes = "0.8"
cbc = "0.1"
# `alloc` is what gives the block-mode helpers their Vec-based padding API.
cipher = { version = "0.4", features = ["alloc"] }
rsa = { version = "0.9", features = ["pem"] }
md5 = "0.7"
# SHA-1, for the `zzc` signature the signed `musics.fcg` route wants.
sha1 = "0.10"
base64 = "0.22"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
